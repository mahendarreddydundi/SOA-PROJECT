server:
  port: 8082
spring:
  application:
    name: complaint-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/complaint_db}
    username: ${SPRING_DATASOURCE_USERNAME:resolvenow}
    password: ${SPRING_DATASOURCE_PASSWORD:resolvenow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
