server:
  port: 8083
spring:
  application:
    name: assignment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/assignment_db}
    username: ${SPRING_DATASOURCE_USERNAME:resolvenow}
    password: ${SPRING_DATASOURCE_PASSWORD:resolvenow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
