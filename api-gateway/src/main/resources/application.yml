server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: ["*"]
            allowedMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates: [Path=/auth/**]
        - id: complaint-service
          uri: http://complaint-service:8082
          predicates: [Path=/complaints/**]
        - id: assignment-service
          uri: http://assignment-service:8083
          predicates: [Path=/assignments/**]
        - id: notification-service
          uri: http://notification-service:8084
          predicates: [Path=/notifications/**]
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
security:
  jwt:
    secret: ${JWT_SECRET:ResolveNow-development-secret-key-change-me-123456}
management:
  endpoints:
    web:
      exposure:
        include: health,info
