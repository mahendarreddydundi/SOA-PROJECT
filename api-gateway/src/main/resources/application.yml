server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates: [Path=/auth/**]
        - id: complaint-service
          uri: lb://complaint-service
          predicates: [Path=/complaints/**]
        - id: assignment-service
          uri: lb://assignment-service
          predicates: [Path=/assignments/**]
        - id: notification-service
          uri: lb://notification-service
          predicates: [Path=/notifications/**]
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
security:
  jwt:
    secret: ${JWT_SECRET:ResolveNow-development-secret-key-change-me-123456}
management:
  endpoints:
    web:
      exposure:
        include: health,info
